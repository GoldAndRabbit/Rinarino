[project]
name = "rinarino"
version = "0.1.0"
description = "Rinarino - 视觉互动小说：生成流水线 + 播放端 + 宿主 WebUI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.9",
    "pyyaml>=6.0.3",
    "httpx>=0.28.1",
    "pillow>=12.3.0",
    "google-genai>=2.23.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.7", "httpx>=0.27"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
