<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rinarino · 视觉互动小说</title>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-name">Rinarino</span>
    <span class="brand-sub">一句设定进去，一个能玩的分支剧情出来</span>
  </div>
  <div class="topbar-note" id="topbar-note"></div>
</header>

<main class="shell">
  <aside class="rail" id="rail" aria-label="小说列表"></aside>

  <section class="stage" id="stage">
    <div class="stage-head">
      <div class="stage-kicker" id="stage-kicker"></div>
      <h1 class="stage-title" id="stage-title">载入中…</h1>
      <div class="controls" id="controls">
        <button class="ctl" id="btn-music" aria-pressed="false">♪ 音乐 关</button>
        <button class="ctl" id="btn-prev">← 上一步</button>
        <button class="ctl ctl-primary" id="btn-next">下一步 →</button>
        <button class="ctl" id="btn-restart">重开</button>
      </div>
    </div>

    <!-- 播放区的 DOM 由 engine/player.js 吐出来，和打包出来的单文件页共用同一份 -->
    <div id="screen"></div>

    <div class="vars" id="vars"></div>
  </section>

  <section class="panel" id="panel">
    <div class="tabs" id="tabs"></div>
    <div class="tabbody" id="tabbody"></div>
  </section>
</main>

<script type="module" src="/js/app.js"></script>
</body>
</html>
