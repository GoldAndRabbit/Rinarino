# 提示词模板的项目级默认变量。模板里写 {{名字}} 就会被替换成这里的值，
# 调用处传同名 kwargs 可以就地盖掉（见 util/prompts.py）。
#
# 改这里等于一次性改掉所有**新生成**的小说的口径；已经生成好的 story.ink /
# cast.json 是产物，不会被回溯修改——要改老作品就重跑那一段。

# 通用口径
language: 中文

# 第 1 段：剧本
min_choices: 2          # 每个有选项的结点至少几个选项
min_endings: 2          # 至少几个结局
node_label_max: 4       # 分支图上结点短名的字数上限

# 第 2 段：设定表。这两项会被写进 cast.json 的 art_direction（style / avoid_style），
# 再拼进第 3 段每一张图的 prompt——整部作品的画风取向**只**在这儿定。
#
# 画风词只准出现在这一处。之前取向词散落在 s3 的 prompt 骨架（「写实场景」
# 「没有线稿和描边」）、cast 模板、restyle 的硬编码负面词里，换一次取向要改四个地方，
# 漏一处就是两种画风在同一张图里打架。改取向：改这里 → --only restyle → 重画。
#
# 取向对齐 agent playground 剧情页的「全片画风」：精致国漫融合日系厚涂插画。
# 第一句照抄参考；后面是把它钉死的作画语言——模型对「精致」「高质量」没反应，
# 对「眼睛放不放大」「描边多粗」这种具体指令才有反应。
# 景深不在这儿：场景浅景深、立绘整张合焦，按图的种类分开给（见 s3_gen_art）。
house_style: >-
  精致国漫融合日系厚涂插画，成熟克制的人体比例与五官、干净平滑的健康肤色、
  清晰细腻的结构笔触、电影感构图，环境以冷暖对比营造都市氛围，人物面部始终有明亮柔和的主光；
  眼睛按真实比例不放大，瞳孔一枚主高光；外轮廓只用极细的深色描边，
  内部结构靠明暗与色块交代；头发分束厚涂，沿发流有柔和高光带；
  布料褶皱与材质分明，笔触干净看不出杂乱笔刷痕

# 画风层面的负面词：和 house_style 成对，换取向时一起换。
# 这部作品自己的忌讳（多余人物、畸形手指…）不放这儿，由 cast 那段写进 avoid。
house_avoid:
  - 照片感
  - 真人实拍质感
  - 三维渲染感
  - 塑料感
  - Q版比例
  - 夸张大眼
  - 粗黑描边
