# 提示词模板的项目级默认变量。模板里写 {{名字}} 就会被替换成这里的值，
# 调用处传同名 kwargs 可以就地盖掉（见 util/prompts.py）。
#
# 改这里等于一次性改掉所有**新生成**的小说的口径；已经生成好的 story.ink /
# cast.json 是产物，不会被回溯修改——要改老作品就重跑那一段。

# 通用口径
language: 中文

# 第 1 段：剧本
min_choices: 2          # 每个有选项的结点至少几个选项
min_endings: 2          # 至少几个结局
node_label_max: 4       # 分支图上结点短名的字数上限

# 第 2 段：设定表。这句会被写进 cast.json 的 art_direction.style，
# 再拼进第 3 段每一张图的 prompt——整部作品的画风取向就靠它统一。
#
# 取向是**写实 + 精致**。写实这一半靠「画不画鼻孔 / 毛孔 / 一根根睫毛」这种
# 具体到可执行的指令钉死，模型对「写实」两个字本身反应很弱；精致那一半靠
# 光线、材质和分辨率给，不靠「精美」「高质量」这类听不出差别的形容词。
# 景深不在这儿——它按图的种类分开给（场景浅景深、立绘整张合焦），见 s3_gen_art。
house_style: >-
  照片级写实，电影剧照的质感：真实人体比例与骨骼结构，五官有鼻孔、唇纹与眼睑厚度；
  皮肤保留毛孔、细小绒毛与自然油光，有次表面散射，不做磨皮；睫毛一根根分明，
  眉毛看得出毛流方向；头发一根根可分辨，有碎发与自然分缝；
  布料有织物纹理、缝线与自重垂坠的褶皱，金属与玻璃有正确的反射和折射；
  全画面没有线稿、没有描边、没有笔刷痕；电影级柔光，真实的光影层次与反射，
  35mm 定焦的透视，高分辨率细节
